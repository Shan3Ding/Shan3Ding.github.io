<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>news | ScholarsArchive</title>
  <link rel="icon" href="../assets/favicon.png">
  <link rel="stylesheet" href="../css/style.css?v=17">
  <script>
    (function () {
      try {
        if (localStorage.getItem("sa-lang") === "zh") document.documentElement.lang = "zh-CN";
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="news">
  <div class="page">
    <div id="site-header"></div>
    <main class="inner">
      <div class="inner-grid">
        <div class="inner-side">
          <div class="inner-side-sticky">
            <h1 class="text-section" data-i18n="page.news">News</h1>
            <p class="page-count" data-i18n="news.subtitle">Updates & announcements</p>
          </div>
        </div>
        <div class="inner-main" id="news-list"></div>
      </div>
    </main>
    <div id="site-footer"></div>
  </div>
  <script type="module" src="../js/site.js?v=17"></script>
</body>
</html>
