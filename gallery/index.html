<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gallery | ScholarsArchive</title>
  <link rel="icon" href="../assets/favicon.png">
  <link rel="stylesheet" href="../css/style.css?v=17">
  <script>
    (function () {
      try {
        if (localStorage.getItem("sa-lang") === "zh") document.documentElement.lang = "zh-CN";
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="gallery">
  <div class="page">
    <div id="site-header"></div>
    <main class="inner">
      <div class="inner-grid" style="margin-bottom:3rem">
        <div class="inner-side">
          <h1 class="text-section" data-i18n="page.gallery">Gallery</h1>
          <p class="page-count" id="gallery-count"></p>
        </div>
        <div class="inner-main">
          <div class="filter-row">
            <button type="button" class="chip is-active" id="gallery-all">All</button>
          </div>
        </div>
      </div>
      <div id="gallery-list"></div>
    </main>
    <div id="site-footer"></div>
  </div>
  <script type="module" src="../js/site.js?v=17"></script>
</body>
</html>
